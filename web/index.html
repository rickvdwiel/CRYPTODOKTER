<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoDokter 🩺</title>
<style>
:root{
  --bg:#05080a; --ink:#e8fff6; --dim:#7ea394; --line:rgba(80,255,200,.14);
  --cyan:#3ef0c2; --mint:#b8ffd6; --amber:#ffb020; --red:#ff5d6c; --blue:#7ee0ff;
  --card:rgba(8,22,20,.78); --glow:rgba(62,240,194,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.35 "Avenir Next","Segoe UI",system-ui,sans-serif}
body{overflow:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.28;
  background:linear-gradient(rgba(62,240,194,.05) 1px,transparent 1px) 0 0/32px 32px,
             linear-gradient(90deg,rgba(62,240,194,.05) 1px,transparent 1px) 0 0/32px 32px;
  animation:griddrift 24s linear infinite}
@keyframes griddrift{to{background-position:32px 32px,32px 32px}}
.app{position:relative;z-index:1;height:100%;display:grid;
  grid-template-rows:auto auto 1fr auto;gap:10px;padding:12px 16px 10px;max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.logo{width:36px;height:36px;border-radius:12px;position:relative;
  background:radial-gradient(circle at 35% 30%,#6cffd8,#0a3 50%,#04221c);
  box-shadow:0 0 18px var(--glow);animation:thump 1.6s ease-in-out infinite}
.logo:after{content:"";position:absolute;inset:12px 9px 12px 15px;border:2px solid #04140f;border-left:0;border-radius:0 40px 40px 0}
@keyframes thump{0%,100%{transform:scale(1)}30%{transform:scale(1.07)}}
h1{margin:0;font-size:20px;letter-spacing:-.03em}
.badge{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-size:10px;font-weight:800;
  letter-spacing:.12em;color:var(--cyan);border:1px solid rgba(62,240,194,.35);border-radius:99px;padding:2px 8px}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.ecg-wrap{display:flex;align-items:center;gap:8px}
.ecg-wrap b{font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);
  border-radius:999px;padding:8px 14px;font:700 13px/1 inherit;cursor:pointer;
  transition:transform .18s, box-shadow .18s, background .18s}
.btn:hover{transform:translateY(-1px);border-color:var(--cyan)}
.btn.pri{background:linear-gradient(180deg,#5dffd4,#1ac9a0);color:#04211a;border:0;
  box-shadow:0 6px 22px rgba(62,240,194,.28);padding:10px 18px}
.btn.pri:hover{box-shadow:0 8px 28px rgba(62,240,194,.45)}
.btn.danger{color:#ff8a94;border-color:rgba(255,93,108,.4)}
.btn.tiny{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:wait;transform:none}
.btn.spin .spinny{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live{display:flex;align-items:center;gap:6px;color:var(--cyan);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.live em{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite;font-style:normal}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr minmax(120px,180px);gap:8px}
@media (max-width:720px){.strip{grid-template-columns:1fr 1fr} body{overflow:auto}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;
  animation:rise .5s ease both}
.stat small{display:block;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.stat b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.up{color:#7dffa8}.down{color:#ff8a94}
.sonar{position:relative;border-radius:50%;aspect-ratio:1;max-height:72px;margin:0 auto;
  background:radial-gradient(circle at 50% 50%,rgba(62,240,194,.2),transparent 55%),
             repeating-radial-gradient(circle,rgba(62,240,194,.2) 0 1px,transparent 1px 12%);
  box-shadow:inset 0 0 16px rgba(62,240,194,.2);overflow:hidden;border:1px solid var(--line)}
.sonar .sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 70%,rgba(62,240,194,.5) 92%,transparent 100%);
  animation:sweep 3.2s linear infinite}
.sonar.hot .sweep{animation-duration:.7s}
@keyframes sweep{to{transform:rotate(360deg)}}
.blip{position:absolute;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);animation:ping 2s ease-out infinite}
.blip.mid{background:var(--amber)}.blip.rug{background:var(--red)}
@keyframes ping{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 10px transparent}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.board{display:grid;grid-template-columns:minmax(260px,.9fr) 1.4fr;gap:10px;min-height:0}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;
  display:flex;flex-direction:column;min-height:0;animation:rise .55s ease both}
.panel h2{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;
  background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
  animation:in .35s ease both}
.row.ok{border-color:rgba(62,240,194,.5);background:rgba(62,240,194,.06)}
.row.no{opacity:.55}
.row b{font-size:14px}
.row .m{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.row .why{color:var(--dim);font-size:11px;text-align:right}
@keyframes in{from{opacity:0;transform:translateX(-16px) scale(.98)}to{opacity:1;transform:none}}
.prog{height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:0 0 8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .25s}
.callout{color:var(--amber);font-size:11px}
.empty{color:var(--dim);font-size:13px;padding:18px 8px;text-align:center}
footer{color:var(--dim);font-size:11px;text-align:center}
.toast{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:6px}
.toast .t{background:#0c1f1b;border:1px solid var(--cyan);color:var(--mint);padding:10px 12px;border-radius:12px;
  animation:slide .3s ease;font-size:13px}
.toast .t.err{border-color:var(--red);color:#ffc4c8}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,8,6,.6);display:none;place-items:center;z-index:6;padding:16px}
.modal.on{display:grid}
.modal .box{background:#0b1916;border:1px solid var(--line);border-radius:16px;padding:18px;max-width:380px;width:100%}
.modal p{color:var(--dim);margin:0 0 12px}
.status{color:var(--mint);font-size:12px;font-weight:600}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="gridbg"></div>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>CryptoDokter <span class="badge"><i></i>PAPIER</span></h1>
    </div>
    <div class="ecg-wrap"><canvas id="ecg" width="140" height="32"></canvas><b id="bpm">72</b></div>
    <div class="actions" id="toolbar">
      <button class="btn pri" onclick="onderzoek(this)"><span class="spinny">◉</span> Onderzoek de markt</button>
      <button class="btn" id="koopgroen" hidden onclick="koopGoedgekeurde(this)">Koop groene</button>
      <button class="btn" onclick="act('tick',{},this)">Tick</button>
      <button class="btn danger" onclick="act('reset',{},this,'Portefeuille terug naar €50?')">Reset</button>
      <span class="live" id="live"><em></em> live</span>
    </div>
  </header>

  <div class="strip">
    <div class="stat"><small>Waarde</small><b id="eq">€—</b></div>
    <div class="stat"><small>Rendement</small><b id="ret">—</b></div>
    <div class="stat"><small>Kas</small><b id="cash">—</b></div>
    <div class="sonar" id="sonar"><div class="sweep"></div><div id="blips"></div></div>
  </div>

  <div class="board">
    <section class="panel">
      <h2>In bezit <span id="poscount">0</span></h2>
      <div class="list" id="pos"></div>
    </section>
    <section class="panel">
      <h2>Markt <span class="status" id="rondestatus">druk op Onderzoek</span></h2>
      <div class="prog"><i id="progbar"></i></div>
      <div class="list exam" id="exam"></div>
    </section>
  </div>

  <footer>⚠️ Geen financieel advies. Score ≥ 35 + liquiditeit ≥ $25k → mag je kopen. Alles virtueel.</footer>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="box">
    <p id="mbody"></p>
    <div class="actions">
      <button class="btn pri" id="mok">Doen (papier)</button>
      <button class="btn" id="mcancel">Nee</button>
    </div>
  </div>
</div>

<script>
const eur=n=>'€'+Number(n).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>(Number(n)>=0?'+':'')+Number(n).toFixed(1)+'%';
const cls=n=>n>=0?'up':'down';
function qty(n){n=Number(n);if(!isFinite(n))return '—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'k';if(n>=1)return n.toFixed(1);return Number(n.toPrecision(3)).toString()}
function px(n){n=Number(n);if(!isFinite(n)||n>=1)return eur(n);return '€'+Number(n.toPrecision(3))}
let health={min_score:35,min_liq:25000,start_eur:50,position_eur:10};
let bpm=72, pulse=0, goedgekeurd=[];

function toast(msg, ok){
  const t=document.createElement('div');
  t.className='t'+(ok===false?' err':'');
  t.textContent=msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(()=>t.remove(),4000);
}
function ask(msg){
  return new Promise(res=>{
    const m=document.getElementById('modal');
    document.getElementById('mbody').textContent=msg;
    m.classList.add('on');
    const done=v=>{m.classList.remove('on');res(v)};
    document.getElementById('mok').onclick=()=>done(true);
    document.getElementById('mcancel').onclick=()=>done(false);
  });
}
function busy(on){
  document.querySelectorAll('#toolbar .btn').forEach(b=>b.disabled=!!on);
}
async function act(soort, body, btn, confirmMsg){
  if(confirmMsg && !(await ask(confirmMsg))) return;
  busy(true);
  if(btn) btn.classList.add('spin');
  try{
    const r=await (await fetch('/api/'+soort,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{})
    })).json();
    toast(r.melding||'klaar', r.ok!==false);
    pulse=1;
    await load();
  }catch(e){ toast(String(e), false); }
  if(btn) btn.classList.remove('spin');
  busy(false);
}
function tween(el, to, fmt, ms){
  const from=Number(el.dataset.v||0), t0=performance.now();
  el.dataset.v=to;
  (function step(t){
    const k=Math.min(1,(t-t0)/ms);
    el.textContent=fmt(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function appendExam(d){
  const ok=d.actie==='zou_kopen'||d.actie==='gekocht';
  const row=document.createElement('div');
  row.className='row '+(ok?'ok':'no');
  const liq=d.liq?('$'+Math.round(d.liq).toLocaleString('nl-NL')):'—';
  const bedrag=health.position_eur||10;
  const buy=ok?`<button class="btn tiny pri" onclick="act('buy',{symbol:'${d.symbol}'},this,'${d.symbol} kopen voor ±€${bedrag} papier?')">Koop</button>`:'';
  const why=ok?'ok':'afgewezen';
  row.innerHTML=`<b>${d.symbol||'?'}</b><span class="m">${d.score??'—'}</span><span class="m">${liq}</span><span class="why">${d.reden||why}</span>${buy}`;
  document.getElementById('exam').prepend(row);
}
function onderzoek(btn){
  goedgekeurd=[];
  document.getElementById('exam').innerHTML='';
  document.getElementById('koopgroen').hidden=true;
  document.getElementById('rondestatus').textContent='bezig…';
  document.getElementById('progbar').style.width='4%';
  document.getElementById('sonar').classList.add('hot');
  busy(true); if(btn) btn.classList.add('spin');
  let klaar=false;
  const es=new EventSource('/api/scan-stream?dry_run=1');
  es.onmessage=e=>{
    let d; try{d=JSON.parse(e.data);}catch(_){return;}
    if(d.fase==='start'){
      document.getElementById('rondestatus').textContent=d.totaal+' tokens';
    }else if(d.fase==='check'){
      appendExam(d);
      if(d.n) document.getElementById('progbar').style.width=((d.i/d.n)*100)+'%';
      document.getElementById('rondestatus').textContent=d.i+'/'+d.n+'  '+d.symbol;
      if(d.actie==='zou_kopen') goedgekeurd.push(d.symbol);
    }else if(d.fase==='klaar'){
      klaar=true; es.close();
      document.getElementById('rondestatus').textContent=(goedgekeurd.length?goedgekeurd.length+' groen':'niets groen');
      document.getElementById('progbar').style.width='100%';
      document.getElementById('sonar').classList.remove('hot');
      const k=document.getElementById('koopgroen');
      if(goedgekeurd.length){ k.hidden=false; k.textContent='Koop '+goedgekeurd.length+' groen'; }
      toast(d.melding,true); pulse=1;
      if(btn) btn.classList.remove('spin'); busy(false); load();
    }
  };
  es.onerror=()=>{
    if(klaar){ es.close(); return; }
    es.close();
    document.getElementById('rondestatus').textContent='fout — opnieuw';
    document.getElementById('sonar').classList.remove('hot');
    if(btn) btn.classList.remove('spin'); busy(false);
  };
}
function koopGoedgekeurde(btn){
  if(!goedgekeurd.length) return;
  act('buy_many',{symbols:goedgekeurd},btn,'Koop '+goedgekeurd.join(', ')+' op papier?');
}

(function(){
  const c=document.getElementById('fx'), x=c.getContext('2d');
  let w,h,ps;
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;
    ps=Array.from({length:28},()=>({x:Math.random()*w,y:Math.random()*h,z:.3+Math.random(),s:Math.random()*1.4}));}
  addEventListener('resize',resize);resize();
  (function draw(){
    x.clearRect(0,0,w,h);
    for(const p of ps){
      p.y-=.12*p.z; if(p.y<0) p.y=h;
      x.fillStyle=`rgba(62,240,194,${.06+p.z*.1})`;
      x.beginPath(); x.arc(p.x,p.y,p.s,0,7); x.fill();
    }
    requestAnimationFrame(draw);
  })();
})();
const ecg=document.getElementById('ecg'), eg=ecg.getContext('2d');
const ebuf=new Array(140).fill(0);
(function tickEcg(){
  const t=performance.now()/1000, ph=(t*(bpm/60))%1;
  let v=Math.sin(t*(bpm/60)*Math.PI*2)*.12;
  if(ph>.12&&ph<.18) v=1; else if(ph>.18&&ph<.22) v=-.4; else if(ph>.22&&ph<.28) v=.3;
  ebuf.push(v+pulse*.8); ebuf.shift(); pulse*=.9;
  eg.clearRect(0,0,140,32);
  eg.strokeStyle='#3ef0c2'; eg.lineWidth=1.4; eg.beginPath();
  ebuf.forEach((y,i)=>{const yy=16-y*11; i?eg.lineTo(i,yy):eg.moveTo(i,yy)});
  eg.stroke();
  requestAnimationFrame(tickEcg);
})();

function paintSonar(ks){
  const box=document.getElementById('blips'); box.innerHTML='';
  (ks||[]).slice(0,8).forEach((k,i)=>{
    const ang=((k.symbol||'').length*47+i*40)%360, rad=22+(k.score||0)/5;
    const d=document.createElement('div');
    const r=k.risk||'';
    d.className='blip '+(r.includes('RUG')?'rug':(r.includes('iets')?'mid':''));
    d.style.left=(50+rad*Math.cos(ang*Math.PI/180))+'%';
    d.style.top=(50+rad*Math.sin(ang*Math.PI/180))+'%';
    box.appendChild(d);
  });
}
async function load(){
  try{
    const jget=async p=>{
      const k=p.split('/').pop();
      if(window.__BOOT && window.__BOOT[k]) return window.__BOOT[k];
      return (await fetch(p)).json();
    };
    const [h, pf]=await Promise.all([jget('/api/health'), jget('/api/portfolio')]);
    health=h;
    document.getElementById('live').innerHTML=h.online?'<em></em> live':'<em style="background:#ff5d6c"></em> off';
    tween(document.getElementById('eq'), pf.equity_eur, eur, 600);
    const ret=document.getElementById('ret'); ret.className=cls(pf.rendement_pct);
    tween(ret, pf.rendement_pct, pct, 600);
    tween(document.getElementById('cash'), pf.cash_eur, eur, 600);
    bpm=Math.round(64+Math.min(36, Math.abs(pf.rendement_pct)/8));
    document.getElementById('bpm').textContent=bpm;
    document.getElementById('poscount').textContent=pf.open_posities;
    if(!pf.posities.length){
      document.getElementById('pos').innerHTML='<div class="empty">Nog niks. Onderzoek → Koop.</div>';
    }else{
      document.getElementById('pos').innerHTML=pf.posities.map(p=>{
        const crazy=Math.abs(p.pnl_pct)>400;
        return `<div class="row ok">
          <b>${p.symbol}</b>
          <span class="m ${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</span>
          <span class="m">${qty(p.qty)}</span>
          <button class="btn tiny danger" onclick="act('sell',{symbol:'${p.symbol}'},this,'${p.symbol} verkopen?')">Verkoop</button>
          ${crazy?'<span class="callout" style="grid-column:1/-1">P&L onbetrouwbaar — waarschijnlijk verkeerde token</span>':''}
        </div>`;
      }).join('');
    }
    const rd=await jget('/api/radar');
    paintSonar(rd.kandidaten||[]);
    const exam=document.getElementById('exam');
    if(!exam.childElementCount && rd.kandidaten){
      rd.kandidaten.slice(0,8).forEach((k,i)=>{
        appendExam({
          symbol:k.symbol, score:k.score, liq:k.liquidity_usd,
          actie:(k.score>=health.min_score && (k.liquidity_usd||0)>=health.min_liq)?'zou_kopen':'overslaan',
          reden:k.risk||''
        });
      });
    }
  }catch(e){ toast('Fout: '+e, false); }
}
load();
setInterval(load, 25000);
</script>
</body>
</html>
